name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner already has the Android SDK; only the licences need accepting.
      - name: Accept Android SDK licenses
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager || true)"
          if [ -x "$SDKM" ]; then yes | "$SDKM" --licenses || true; fi
          ls "$ANDROID_HOME/licenses" || true

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Generate the Android project
        run: npx cap add android

      - name: Apply icon, splash and version number
        continue-on-error: true
        run: |
          RES=android/app/src/main/res
          cp -r resources/android/res/mipmap-* "$RES"/
          BG=$(find resources -name "ic_launcher_background.xml" | head -n 1)
          if [ -n "$BG" ]; then sed -i 's/>#[0-9A-Fa-f]\{6,8\}</>#14122B</' "$BG"; fi
          find "$RES" -name 'splash.png' -exec cp resources/splash.png {} \;
          RUN=${{ github.run_number }}
          sed -i "s/versionCode *=* *[0-9]\+/versionCode $RUN/; s/versionName *=* *\"[^\"]*\"/versionName \"1.0.$RUN\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle || true

      # Same signing key on every build, so a new APK installs over the old one and keeps your drawings.
      - name: Use the fixed signing key
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Inkpond.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: Inkpond-apk
          path: dist/Inkpond.apk

      - name: Publish a release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Inkpond build ${{ github.run_number }}
          body: Download Inkpond.apk below and open it on your Android phone.
          files: dist/Inkpond.apk
