name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Generate the Android project
        run: |
          npx cap add android
          # original launcher icon, launch background and splash
          cp -r resources/android/res/. android/app/src/main/res/
          find android/app/src/main/res -name 'splash.png' -exec cp resources/splash.png {} \;
          # stable signing key, so every build can update the previous install
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore
          # bump the version with every run (handles both `versionCode 1` and `versionCode = 1`)
          RUN=${{ github.run_number }}
          sed -i "s/versionCode *=* *[0-9]\+/versionCode $RUN/; s/versionName *=* *\"[^\"]*\"/versionName \"1.0.$RUN\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          chmod +x android/gradlew
          npx cap sync android

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Inkpond.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: Inkpond-apk
          path: dist/Inkpond.apk

      - name: Publish a release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Inkpond build ${{ github.run_number }}
          body: Download Inkpond.apk below and open it on your Android phone.
          files: dist/Inkpond.apk
